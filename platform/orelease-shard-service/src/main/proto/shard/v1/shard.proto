// protocol buffer file for shard APIs
syntax = "proto3";

// name space to avoid name collision with any other proto file
package shard;
import "google/protobuf/timestamp.proto";

// where the generated classes should be placed
option java_package = "io.github.haidarim.shard.generated.grpc";

// generate separate java file for each message, enum and service instead of putting all in one
option java_multiple_files = true;

// define enum type
enum ShardDomain {
    UNSPECIFIED_DOMAIN = 0;
    CLIENT = 1;             // Fixed typo (CLIEN -> CLIENT)
    CHAT = 2;
    NOTIFICATION = 3;
}

enum NodeRole {
    UNSPECIFIED_ROLE = 0;
    PRIMARY = 1;
    REPLICA = 2;
}

enum ShardStatus{
    UNSPECIFIED_SHARD_STATUS = 0;
    ACTIVE = 1;
    INACTIVE = 2;
    MIGRATING = 3;
    SHARD_FAILED = 4;
}

enum NodeStatus {
    UNSPECIFIED_NODE_STATUS = 0;
    ONLINE = 1;
    OFFLINE = 2;
    DRAINING = 3;
}

enum MigrationStatus{
    UNSPECIFIED_MIGRATION_STATUS = 0;
    STARTED = 1;
    COPYING = 2;
    VALIDATING = 3;
    COMPLETED = 4;
    MIGRATION_FAILED = 5;
    CANCELLED = 6;
}

enum LockReason {
    UNSPECIFIED_LOCK_REASON = 0;
    MIGRATION = 1;
    NODE_ADDITION = 2;
    NODE_REMOVAL = 3;
    REBALANCE = 4;
    MAINTENANCE = 5;
    MANUAL = 6;
}


// ==========================================
// CONTROL (CONTROL PLANE) MESSAGES
// ==========================================
message GetShardRequest{
    string shard_name = 1;
}

message GetShardResponse{
    int32 shard_id = 1;
    string shard_name = 2;
    string database_name = 3;
    ShardDomain domain = 4;
    ShardStatus status = 5;
    int64 version = 6;
}

message GetAllShardsRequest{
    // No filed needed
}

message GetAllShardsResponse{
    repeated GetShardResponse shards = 1;
}

message GetShardsForDatabaseRequest{
    string database_name = 1;
    ShardDomain domain = 2;
}

message GetShardsForDatabaseResponse{
    repeated GetShardResponse shards = 1;
}

message CreateShardRequest{
    string shard_name = 1;
    string database_name = 2;
    ShardDomain domain = 3;
    ShardStatus status = 4;
}

message CreateShardResponse{
    int32 shard_id = 1;
    string shard_name = 2;
}

message UpdateShardRequest{
    string shard_name = 1;
    string database_name = 2;
    ShardDomain domain = 3;
    ShardStatus status = 4;
    int64 expected_version = 5;
}

message UpdateShardResponse{
    int32 shard_id = 1;
    string shard_name = 2;
    int64  version = 3;
}

message DeleteShardRequest{
    string shard_name = 1;
}

message DeleteShardResponse{
    int32 shard_id = 1;
}



message GetAllNodesRequest{
    // no field needed
}

message GetNodeByIdRequest{
    int64 node_id = 1;
}

message GetNodeByDetailsRequest{
    string shard_name = 1;
    string host_name = 2;
    int32 port = 3;
}

message GetNodeResponse {
    int64 node_id = 1;
    int32 shard_id = 2;
    string shard_name = 3;
    string hostname = 4;
    int32 port = 5;
    string region = 6;
    NodeRole role = 7;
    string connection_secret = 8;
    int32 max_connections = 9;
    int32 weight = 10;
    NodeStatus status = 11;
}

message GetAllNodesResponse{
    repeated GetNodeResponse nodes = 1;
}

message GetAllNodesForShardRequest{
    string shard_name = 1;
}

message CreateNodeRequest {
    string shard_name = 1;
    string hostname = 2;
    int32 port = 3;
    string region = 4;
    NodeRole role = 5;
    string connection_secret = 6;
    int32 max_connections = 7;
    int32 weight = 8;
    NodeStatus status = 9;
}

message CreateNodeResponse {
    int64 node_id = 1;
    int32 shard_id = 2;
    string shard_name = 3;
    string hostname = 4;
    int32 port = 5;
}

message UpdateNodeRequest {
    int64 node_id = 1;
    string hostname = 2;
    int32 port = 3;
    string region = 4;
    NodeRole role = 5;
    string connection_secret = 6;
    int32 max_connections = 7;
    int32 weight = 8;
    NodeStatus status = 9;
}

message UpdateNodeResponse {
    int64 node_id = 1;
    int32 shard_id = 2;
    string shard_name = 3;
    string hostname = 4;
    int32 port = 5;
}

message DeleteNodeRequest{
    string shard_name = 1;
    string hostname = 2;
    int32 port = 3;
}

message DeleteNodeResponse{
    int64  node_id = 1;
}



message GetShardLocksRequest{
    // no field needed
}

message GetShardLocksResponse{
    repeated ShardLockResponse shard_locks = 1;
}

message GetAllLocksForShardRequest{
    string shard_name = 1;
}

message AcquireLockRequest{
    string shard_name = 1;
    int64 migration_id = 2;
    LockReason reason = 3;
    google.protobuf.Timestamp expires_at = 4;
}

message AcquireLockResponse{
    string shard_name = 1;
}

message ReleaseLockRequest{
    string shard_name = 1;
}

message ReleaseLockResponse{
    string shard_name = 1;
}

message ShardLockResponse{
    string shard_name = 1;
    int64 migration_id = 2;
    LockReason reason = 3;
    google.protobuf.Timestamp expires_at = 4;
    google.protobuf.Timestamp locked_at = 5;
}


message GetMigrationRequest{
    int64 migration_id = 1;
}

message GetMigrationResponse{
    int32 from_shard_id = 1;
    int32 to_shard_id = 2;
    MigrationStatus status = 3;
    int32 process_percent = 4;
    string error_message = 5;
    google.protobuf.Timestamp started_at = 6;
    google.protobuf.Timestamp completed_at = 7;
}

message GetAllMigrationsRequest{

}

message GetAllMigrationsResponse{
    repeated GetMigrationResponse migrations = 1;
}

message GetAllMigrationsForShardRequest{
    string shard_name = 1;
}

message CreateMigrationRequest{
    int32 from_shard_id = 1;
    int32 to_shard_id = 2;
}

message CreateMigrationResponse{
    int64 migration_id = 1;
    MigrationStatus status = 2;
    google.protobuf.Timestamp started_at = 3;
}


message UpdateMigrationRequest {
    int64 migration_id = 1;
    MigrationStatus status = 2;
    int32 progress_percent = 3;
    string error_message = 4;
}

message UpdateMigrationResponse {
    int64 migration_id = 1;
    MigrationStatus status = 2;
    int32 progress_percent = 3;
    string error_message = 4;
    google.protobuf.Timestamp started_at = 5;
    google.protobuf.Timestamp completed_at = 6;
}

message CancelMigrationRequest{
    int64 migration_id = 1;
}

message CancelMigrationResponse{
    int64 migration_id = 1;
    MigrationStatus status = 2;
}

// ==========================================
// RUNTIME (CONTROL PLANE) MESSAGES
// ==========================================
message ShardRouteRequest{
    string entity_id = 1;
    ShardDomain domain = 2;
}

message ShardRouteResponse{
    string shard_name = 1;
    string database_name = 2;
    string hostname = 3;
    int32 port = 4;
    int64 version = 5;
}


/**
 * Controller Services
 */
service ShardMapApiService{
    rpc GetAllShards(GetAllShardsRequest) returns (GetAllShardsResponse);
    rpc GetShard(GetShardRequest) returns (GetShardResponse);
    rpc GetShardsForDatabase(GetShardsForDatabaseRequest) returns (GetShardsForDatabaseResponse);
    rpc CreateShard(CreateShardRequest) returns (CreateShardResponse);
    rpc UpdateShard(UpdateShardRequest) returns (UpdateShardResponse);
    rpc DeleteShard(DeleteShardRequest) returns (DeleteShardResponse);
}

service ShardLockApiService{
    rpc GetShardLocks(GetShardLocksRequest) returns (GetShardLocksResponse);
    rpc GetAllLocksForShard(GetAllLocksForShardRequest) returns (GetShardLocksResponse);
    rpc AcquireLock(AcquireLockRequest) returns (AcquireLockResponse);
    rpc ReleaseLock(ReleaseLockRequest) returns (ReleaseLockResponse);
}

service ShardMigrationApiService{
    rpc GetMigration(GetMigrationRequest) returns (GetMigrationResponse);
    rpc GetAllMigrations(GetAllMigrationsRequest) returns (GetAllMigrationsResponse);
    rpc GetAllMigrationsForShard(GetAllMigrationsForShardRequest) returns (GetAllMigrationsResponse);
    rpc CreateMigration(CreateMigrationRequest) returns (CreateMigrationResponse);
    rpc UpdateMigration(UpdateMigrationRequest) returns (UpdateMigrationResponse);
    rpc CancelMigration(CancelMigrationRequest) returns (CancelMigrationResponse);
}

service ShardNodeApiService{
    rpc GetNodeById(GetNodeByIdRequest) returns (GetNodeResponse);
    rpc GetNodeByDetails(GetNodeByDetailsRequest) returns (GetNodeResponse);
    rpc GetAllNodesForShard(GetAllNodesForShardRequest) returns (GetAllNodesResponse);
    rpc GetAllNodes(GetAllNodesRequest) returns (GetAllNodesResponse);
    rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
    rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse);
    rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);
}



/**
 * Runtime Services
 */
service ShardRouteApiService{
    rpc ResolveRoute(ShardRouteRequest) returns (ShardRouteResponse);
}